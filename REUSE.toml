version = 1
SPDX-PackageName = "mailman3-fedmsg-plugin"
SPDX-PackageSupplier = "Fedora Infrastructure <admin@fedoraproject.org>"
SPDX-PackageDownloadLocation = "https:////github.com/fedora-infra/mailman3-fedmsg-plugin"

[[annotations]]
path = ["**.yaml", "**.md", "**.rst", "**.toml", ".gitignore", "**.ini", ".github/**", "*.example"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the Fedora Project"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["mailman_schema/**.toml", "mailman_schema/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the Fedora Project"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["poetry.lock", "mailman_schema/poetry.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "None, autogenerated"
SPDX-License-Identifier = "LGPL-3.0-or-later"
